<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="0.55" stop-color="#121019"/>
      <stop offset="1" stop-color="#0b0a10"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211c33"/>
      <stop offset="1" stop-color="#16131f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2" fill="#a78bfa" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- neural links behind the head -->
  <g stroke="#a78bfa" stroke-width="3" opacity="0.28" fill="none">
    <path d="M512 214 L330 150 M512 214 L694 150 M330 150 L200 250 M694 150 L824 250"/>
    <path d="M262 520 L150 470 M262 520 L140 610 M762 520 L874 470 M762 520 L884 610"/>
  </g>
  <g fill="#a78bfa" opacity="0.45">
    <circle cx="330" cy="150" r="9"/><circle cx="694" cy="150" r="9"/>
    <circle cx="200" cy="250" r="7"/><circle cx="824" cy="250" r="7"/>
    <circle cx="150" cy="470" r="7"/><circle cx="140" cy="610" r="9"/>
    <circle cx="874" cy="470" r="7"/><circle cx="884" cy="610" r="9"/>
  </g>

  <!-- antenna -->
  <line x1="512" y1="300" x2="512" y2="222" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
  <circle cx="512" cy="208" r="22" fill="#a78bfa" filter="url(#glow)"/>

  <!-- ears -->
  <rect x="236" y="460" width="40" height="120" rx="20" fill="#a78bfa" opacity="0.85"/>
  <rect x="748" y="460" width="40" height="120" rx="20" fill="#a78bfa" opacity="0.85"/>

  <!-- head -->
  <rect x="276" y="300" width="472" height="440" rx="120" fill="url(#shell)" stroke="#a78bfa" stroke-width="10"/>

  <!-- screen -->
  <rect x="330" y="380" width="364" height="230" rx="64" fill="#0b0a10" stroke="#2c2542" stroke-width="4"/>

  <!-- eyes: a prompt and a cursor -->
  <g filter="url(#glow)">
    <path d="M400 452 L452 495 L400 538" fill="none" stroke="#c4b5fd" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="566" y="450" width="46" height="90" rx="10" fill="#c4b5fd"/>
  </g>

  <!-- mouth: a quiet little smile -->
  <path d="M466 668 Q512 696 558 668" fill="none" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- body hint -->
  <path d="M332 1024 L332 860 Q332 800 392 800 L632 800 Q692 800 692 860 L692 1024 Z" fill="url(#shell)" stroke="#a78bfa" stroke-width="10"/>
  <rect x="490" y="740" width="44" height="60" fill="#211c33" stroke="#a78bfa" stroke-width="8"/>
  <text x="512" y="905" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="54" font-weight="700" fill="#a78bfa" letter-spacing="2">tobi-1</text>
</svg>
